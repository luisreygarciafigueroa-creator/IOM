name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Validate tag and publish manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate semantic-version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must follow vMAJOR.MINOR.PATCH (received: $RELEASE_TAG)" >&2
            exit 1
          fi
      - name: Generate SHA-256 manifest
        id: manifest
        run: |
          python3 scripts/create_manifest.py
          echo "sha256=$(sha256sum MANIFEST.sha256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Publish release with source manifest
        uses: softprops/action-gh-release@v2
        with:
          name: IOM ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Versión semántica: `${{ github.ref_name }}`

            SHA-256 del archivo `MANIFEST.sha256` adjunto: `${{ steps.manifest.outputs.sha256 }}`

            El campo `spec_version` en `data/iom_spec.json` versiona por separado el contrato de especificación.
          files: MANIFEST.sha256
