name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lean:
    name: Lean 4 build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          build: true

  ontology:
    name: RDF, SHACL, schema and experiments
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - name: Validate iom_spec.json against schema
        run: python scripts/validate_spec.py
      - name: Check specification migrations
        run: python scripts/migrate_spec.py --check
      - run: python scripts/generate_ontology.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_shacl.py
      - name: Reproducible PI-HGAT-T experiment
        run: python experiments/pi_hgat_t.py
      - name: Baseline classifiers comparison
        run: python experiments/baselines.py
      - name: Generate audit report
        run: python scripts/generate_audit_report.py
