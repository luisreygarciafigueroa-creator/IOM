name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Único workflow de validez del repositorio.
# Encuentro (EXP-A/E, PI-HGAT-T) vive en workflows/encuentro.yml (manual).

jobs:
  lean:
    name: Lean 4 build (SelfGenesis)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # GitHub /releases/latest de elan falla intermitentemente (503/504).
      # Descargamos un tarball de versión fija con reintentos e instalamos a mano.
      - name: Install elan v4.2.4 (pinned tarball + retries)
        run: |
          set -euo pipefail
          ELAN_VERSION=v4.2.4
          ARCH=x86_64-unknown-linux-gnu
          URL="https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-${ARCH}.tar.gz"
          TMPDIR="$(mktemp -d)"
          for i in 1 2 3 4 5 6 7 8; do
            echo "Attempt $i: downloading $URL"
            if curl -fsSL --retry 2 --retry-delay 2 -o "$TMPDIR/elan.tar.gz" "$URL"; then
              break
            fi
            echo "Download failed; waiting $((i * 4))s..."
            sleep $((i * 4))
          done
          test -s "$TMPDIR/elan.tar.gz"
          tar -xzf "$TMPDIR/elan.tar.gz" -C "$TMPDIR"
          # El tarball contiene el binario elan-init
          INIT_BIN="$(find "$TMPDIR" -type f -name 'elan-init' -o -name 'elan' | head -1)"
          test -n "$INIT_BIN"
          chmod +x "$INIT_BIN"
          "$INIT_BIN" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          rm -rf "$TMPDIR"

      - name: Install Lean toolchain from lean-toolchain
        run: |
          set -euo pipefail
          TOOLCHAIN="$(cat lean-toolchain)"
          elan toolchain install "$TOOLCHAIN"
          elan default "$TOOLCHAIN"
          lean --version
          lake --version

      - name: lake build
        run: lake build

  core:
    name: Núcleo autónomo (punto fijo, SHACL, invariancia)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
      - name: Validate iom_spec.json against JSON Schema
        run: python scripts/validate_spec.py
      - name: Check specification migrations
        run: python scripts/migrate_spec.py --check
      - name: Generate ontology/CSV and require versioned CSV match
        run: python scripts/check_generated_committed.py
      - name: Punto fijo idempotente (CSV + sello spec_version)
        run: python scripts/self_bootstrap.py --passes 2
      - name: Check spec ↔ CSV sync
        run: python scripts/sync_spec_artifacts.py --check
      - name: Regenerar TTL (generador + materialize determinista)
        run: |
          python scripts/generate_ontology.py
          python scripts/materialize_ttl.py
      - name: Unit tests (ontología, reglas, schema)
        run: |
          python -m unittest \
            tests.test_formal_rules_bridge \
            tests.test_metrics_audit \
            tests.test_ontology \
            tests.test_property_based \
            tests.test_property_links \
            tests.test_score_independent_eval \
            tests.test_validate_spec \
            -v
      - name: OWL RL + SHACL
        run: python scripts/validate_shacl.py
      - name: Invariancia no trivial (+ control negativo)
        run: python scripts/measure_invariance.py
